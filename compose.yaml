name: yoyo-workbench
services:
  init:
    image: node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
    user: '0:0'
    environment:
      STATE_DIR: /state
      AI_CONFIG_FILE: /state/ai.json
    volumes:
      - state:/state
      - ./tools/init-state.mjs:/init-state.mjs:ro
    command: ['node', '/init-state.mjs']
    restart: 'no'
  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: yoyo
      POSTGRES_DB: yoyo
      POSTGRES_PASSWORD_FILE: /state/postgres-password
    volumes:
      - state:/state:ro
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yoyo -d yoyo']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.15@sha256:1593bd2a98964f5d4df83fa7db2b3d4ee7b20190813cc5bf8c3200e0e70d346e
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - state:/state:ro
      - objects:/data
    ports:
      - '127.0.0.1:${S3_PORT:-59000}:9000'
    command: ['server', '-dir=/data', '-s3', '-s3.port=9000', '-s3.config=/state/storage-config.json', '-ip.bind=0.0.0.0', '-volume.max=50', '-master.volumeSizeLimitMB=1024', '-volume.preStopSeconds=1']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9333/cluster/status']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    build: .
    image: yoyo-local:0.1.0
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment: &environment
      DB_HOST: db
      DB_PORT: '5432'
      STATE_DIR: /state
      AI_CONFIG_FILE: /state/ai.json
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
      SOURCE_BRIDGE_URL: ${SOURCE_BRIDGE_URL:-}
      SOURCE_BRIDGE_TOKEN: ${SOURCE_BRIDGE_TOKEN:-}
      API_HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-43200}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-7200}
    volumes: &volumes
      - state:/state
    command: ['sh', '-c', 'node dist/packages/db/src/migrate.js && node dist/tools/storage-init.js']
    restart: 'no'
  api:
    image: yoyo-local:0.1.0
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *environment
    volumes: *volumes
    ports:
      - '127.0.0.1:${YOYO_PORT:-3000}:3000'
    command: ['node', 'dist/apps/api/src/main.js']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  worker:
    image: yoyo-local:0.1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *environment
    volumes: *volumes
    command: ['node', 'dist/apps/worker/src/main.js']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1
  reminder:
    image: yoyo-local:0.1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *environment
      WORKER_POOL: reminder
    volumes: *volumes
    command: ['node', 'dist/apps/worker/src/main.js']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
  media:
    image: yoyo-local:0.1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *environment
      WORKER_POOL: media
      MEDIA_ENDPOINT: http://media-executor:9010
    volumes: *volumes
    networks: [default, media]
    command: ['node', 'dist/apps/worker/src/main.js']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  media-executor:
    build:
      context: .
      dockerfile: tools/media/Dockerfile
    image: yoyo-media-local:0.1.0
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: state
        target: /run/media
        read_only: true
        volume:
          subpath: media
      - media-scratch:/scratch
    entrypoint: ['sh', '-c', 'exec node /app/server.mjs']
    environment:
      MEDIA_TOKEN_FILE: /run/media/media-token
    networks: [media]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  scheduler:
    image: yoyo-local:0.1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *environment
    volumes: *volumes
    command: ['node', 'dist/apps/scheduler/src/main.js']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
volumes:
  state:
  database:
  objects:
  media-scratch:
networks:
  media:
    internal: true
