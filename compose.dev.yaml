name: yoyo-dev
services:
  init:
    volumes:
      - ./.local/state:/state
      - ./tools/init-state.mjs:/init-state.mjs:ro
  db:
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - ./.local/state:/state:ro
      - database:/var/lib/postgresql/data
  storage:
    volumes:
      - ./.local/state:/state:ro
      - objects:/data
  media-executor:
    networks: [default, media]
    volumes:
      - ./.local/state/media:/run/media:ro
      - media-scratch:/scratch
    ports:
      - '127.0.0.1:59010:9010'
