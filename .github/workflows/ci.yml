name: Current scope and S11 checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: yoyo
          POSTGRES_PASSWORD: ci-only-database
          POSTGRES_DB: yoyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U yoyo -d yoyo_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://yoyo:ci-only-database@127.0.0.1:5432/yoyo_test
      STATE_DIR: .local/state
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/init-state.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/s11/check.mjs
      - run: docker compose config --quiet
      - run: docker compose build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
